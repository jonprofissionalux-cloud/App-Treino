<style>
:root{
  --bg:#0D0D0D; --card:#1A1A18; --ink:#F5F1E8; --sub:#948D7E; --line:#2E2B25;
  --accent:#F5C518; --accent-ink:#0D0D0D;
  --peito:#D98E3D; --costas:#D9583B; --pernas:#4F86BF; --ombro:#7FAE5C; --upper:#B07FCC; --iso:#3DD6D0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
h1,.num,.timer-big,.ord,.evo-num{font-family:'Oswald',Impact,sans-serif;}
header{padding:22px 20px 12px; padding-top:calc(22px + env(safe-area-inset-top,0px)); display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
header h1{margin:0 0 4px; font-size:24px; font-weight:700; line-height:1.25;}
header p{margin:0; color:var(--accent); font-size:13px; font-weight:600;}
.evo-btn{
  flex:0 0 auto; background:var(--card); border:1px solid var(--line); color:var(--ink);
  border-radius:11px; padding:9px 13px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:6px 20px 10px; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto; padding:9px 16px; border-radius:999px; border:1.5px solid var(--line);
  background:transparent; color:var(--ink); font-family:'Inter',sans-serif; font-weight:600;
  font-size:14px; cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.daycaption{
  padding:0 20px 16px; color:var(--accent); font-weight:600; font-size:13.5px;
  display:flex; align-items:baseline; gap:6px;
}
.daycaption .ord{font-size:15px; font-weight:700;}
main{padding:4px 16px 90px; max-width:640px; margin:0 auto;}
.card{
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--dcolor,var(--line));
  border-radius:14px; padding:14px 16px; margin-bottom:10px;
}
.card-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.ex-name-wrap{flex:1; min-width:0;}
.ex-name{font-size:16px; font-weight:600; line-height:1.3;}
.ex-meta{color:var(--sub); font-size:12px; margin-top:2px;}
.weight-box{flex:0 0 auto; display:flex; align-items:center; gap:3px;}
.stepper{
  width:21px; height:21px; border-radius:7px; border:1px solid var(--line); background:transparent;
  color:var(--ink); font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.weight-val{
  width:44px; min-width:0; text-align:center; font-size:16px; font-weight:700; border:none; background:transparent;
  color:var(--ink); font-family:'Oswald',sans-serif; padding:0;
}
.weight-val:focus{outline:none;}
.unit{font-size:9.5px; color:var(--sub); margin-left:-2px;}
.card-mid{display:flex; align-items:center; gap:10px; margin-top:12px;}
.sets{display:flex; gap:8px;}
.setdot{
  width:34px; height:34px; border-radius:10px; border:1.5px solid var(--line); background:transparent;
  color:var(--sub); font-weight:700; font-family:'Oswald',sans-serif; font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.setdot.done{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.card-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px;}
.obs{font-size:12.5px; color:var(--sub); font-style:italic; flex:1;}
.video-btn{
  flex:0 0 auto; border:none; padding:7px 13px; border-radius:9px; font-size:13px; font-weight:700;
  color:var(--accent-ink); background:var(--accent); cursor:pointer;
  text-decoration:none; display:inline-block;
}
.no-weight{color:var(--sub); font-size:13px;}
.empty-obs{visibility:hidden;}
.check-badge{color:var(--accent); font-weight:700;}
footer{text-align:center; color:var(--sub); font-size:11.5px; padding:10px 20px 30px;}

.card-timer{
  margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.card-timer.alert{
  border-top-color:var(--accent); background:var(--accent); margin:12px -16px -14px; padding:12px 16px 14px;
  border-radius:0 0 14px 14px;
}
.card-timer.alert *{color:var(--accent-ink) !important;}
.timer-left{display:flex; align-items:center; gap:10px;}
.timer-big{font-size:26px; font-weight:700; min-width:48px; font-family:'Oswald',sans-serif;}
.timer-label{font-size:12px; color:var(--sub);}
.timer-actions{display:flex; gap:6px;}
.tbtn{
  border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:8px;
  padding:6px 10px; font-weight:600; font-size:12px; cursor:pointer;
}
.day-complete{
  background:var(--accent); color:var(--accent-ink); border-radius:16px; padding:22px 16px;
  margin-bottom:16px; text-align:center; box-shadow:0 0 0 3px var(--accent), 0 8px 30px rgba(245,197,24,.45);
  animation:pulseGlow 1.6s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{ transform:scale(1); box-shadow:0 0 0 3px var(--accent), 0 8px 24px rgba(245,197,24,.35); }
  50%{ transform:scale(1.015); box-shadow:0 0 0 5px var(--accent), 0 10px 34px rgba(245,197,24,.6); }
}
.day-complete .fire{font-size:34px; display:block; margin-bottom:2px;}
.day-complete .msg{font-family:'Oswald',sans-serif; font-size:21px; font-weight:700; margin-bottom:14px; letter-spacing:.3px;}
.day-complete button{
  border:none; background:var(--accent-ink); color:var(--accent); font-weight:700;
  padding:11px 20px; border-radius:11px; font-size:14px; cursor:pointer;
}
.tbtn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.evo-panel{
  position:fixed; inset:0; z-index:60; background:var(--bg); transform:translateX(110%);
  transition:transform .22s ease; overflow-y:auto;
  padding:calc(22px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));
}
.evo-panel.show{transform:translateX(0);}
.evo-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.evo-head h2{margin:0; font-size:22px; font-weight:700; font-family:'Oswald',sans-serif;}
.evo-row{display:flex; gap:10px; margin-bottom:16px;}
.evo-stat{
  flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;
}
.evo-num{font-size:30px; font-weight:700; color:var(--accent);}
.evo-stat-label{font-size:12px; color:var(--sub); margin-top:2px;}
.evo-section-title{font-size:13.5px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; margin:20px 0 8px;}
.evo-top{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:8px;}
.evo-top .name{font-weight:600; font-size:15px;}
.evo-top .cnt{color:var(--accent); font-weight:700; font-size:13px; margin-top:2px;}
.evo-hist{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:8px;}
.evo-hist .name{font-weight:600; font-size:15px; margin-bottom:6px;}
.evo-hist .trail{font-size:13px; color:var(--sub); display:flex; flex-wrap:wrap; gap:4px 10px;}
.evo-hist .trail b{color:var(--ink);}
.evo-linechart{margin-top:4px;}
.evo-bar-row{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
.evo-bar-row:last-child{margin-bottom:0;}
.evo-bar-date{width:38px; font-size:10.5px; color:var(--sub); flex:0 0 auto;}
.evo-bar-track{flex:1; background:var(--line); border-radius:6px; height:16px; overflow:hidden;}
.evo-bar-fill{background:var(--accent); height:100%; border-radius:6px 0 0 6px; min-width:6%; transition:width .3s ease;}
.evo-bar-val{width:48px; text-align:right; font-size:12.5px; font-weight:700; color:var(--ink); flex:0 0 auto; font-family:'Oswald',sans-serif;}
.evo-empty{color:var(--sub); font-size:13.5px; padding:10px 2px;}

.iso-card{background:var(--card); border:1.5px dashed var(--iso); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
.iso-card.alert{background:var(--iso); border-style:solid; animation:pulseGlow 1.2s ease-in-out infinite;}
.iso-card.alert *{color:#0D0D0D !important;}
.iso-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.iso-title{font-weight:600; font-size:16px; color:var(--iso);}
.iso-sub{font-size:12px; color:var(--sub); margin-top:2px;}
.iso-num{font-family:'Oswald',sans-serif; font-size:44px; font-weight:700; line-height:1; color:var(--ink);}
.iso-actions{display:flex; gap:8px; margin-top:12px;}
.iso-btn{flex:1; border:none; border-radius:10px; padding:11px; font-weight:700; font-size:14px; cursor:pointer; background:var(--iso); color:#0D0D0D;}
.iso-btn.ghost{flex:0 0 auto; background:transparent; border:1px solid var(--line); color:var(--ink); padding:11px 16px;}
.iso-card.alert .iso-btn{background:#0D0D0D; color:var(--iso) !important;}
.iso-card.warn{border:2px solid var(--accent);}
.iso-card.warn .iso-num{color:var(--accent);}
.iso-card.danger{border:2px solid #FF3B30; animation:pulseRed .8s ease-in-out infinite;}
.iso-card.danger .iso-num{color:#FF3B30;}
@keyframes pulseRed{
  0%,100%{ box-shadow:0 0 0 0 rgba(255,59,48,0); transform:scale(1); }
  50%{ box-shadow:0 0 0 4px rgba(255,59,48,.55), 0 0 22px rgba(255,59,48,.6); transform:scale(1.015); }
}
.wake{cursor:pointer; display:inline-block; margin-top:6px;}
.daycaption{justify-content:space-between;}
.edit-toggle{background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;}
.edit-toggle.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.editing-row{display:flex; align-items:center; gap:8px; padding:12px 14px;}
.drag-handle{cursor:grab; color:var(--sub); font-size:19px; padding:2px 6px 2px 0; flex:0 0 auto; touch-action:none; user-select:none;}
.icon-btn{background:transparent; border:1px solid var(--line); color:var(--sub); font-size:12.5px; font-weight:600; cursor:pointer; padding:6px 10px; border-radius:8px; flex:0 0 auto;}
.icon-btn.danger{color:#FF3B30; border-color:#FF3B30;}
.edit-icons{display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.edit-form{padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
.edit-form input{background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 10px; font-size:14px; font-family:'Inter',sans-serif; width:100%;}
.edit-form label{font-size:11px; color:var(--sub); margin-bottom:-4px;}
.edit-form-actions{display:flex; gap:8px; margin-top:2px;}
.edit-form-actions button{flex:1; border:none; border-radius:9px; padding:10px; font-weight:700; font-size:13px; cursor:pointer;}
.edit-save{background:var(--accent); color:var(--accent-ink);}
.edit-cancel{background:transparent; border:1px solid var(--line); color:var(--ink);}
.add-ex-btn{width:100%; background:transparent; border:1.5px dashed var(--line); color:var(--sub); border-radius:14px; padding:14px; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:10px;}
.sortable-ghost{opacity:.35;}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="pageTitle">🏋️‍♀️ Hora de treinar, Jon!</h1>
    <p id="motivation"></p>
  </div>
  <button class="evo-btn" id="openEvo">📊 Evolução</button>
</header>
<div class="tabs" id="tabs"></div>
<div class="daycaption" id="daycaption"></div>
<main id="main"></main>
<footer>Salvo neste aparelho.<br><span class="wake" id="wakeStatus"></span></footer>

<div class="evo-panel" id="evoPanel">
  <div class="evo-head"><h2>📊 Sua evolução</h2><button class="tbtn" id="closeEvo">Fechar</button></div>
  <div class="evo-row">
    <div class="evo-stat"><div class="evo-num" id="evoWeek">0</div><div class="evo-stat-label">dias treinados essa semana</div></div>
    <div class="evo-stat"><div class="evo-num" id="evoMonth">0</div><div class="evo-stat-label">dias treinados esse mês</div></div>
  </div>
  <div class="evo-section-title">Exercício mais feito</div>
  <div id="evoTop"></div>
  <div class="evo-section-title">Histórico de cargas</div>
  <div id="evoHist"></div>
</div>

<script>
const WEEKDAYS = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira'];
const MOTIVATION = [
  'Domingo é dia de descanso — ou de se preparar mentalmente 💛',
  'Segunda pesada, semana forte. Bora! 💪',
  'Terça de foco. Um peso de cada vez.',
  'Quarta: metade da semana, metade do caminho.',
  'Quinta com força total — a semana quase fechou.',
  'Sexta: fecha com chave de ouro 🔑',
  'Sábado também conta. Disciplina é hábito.'
];
const DAYS = [
  { id:'peito', label:'Peito/Tríceps', color:'--peito', exercises:[
    {n:'Supino com halteres', w:26, v:'https://www.youtube.com/watch?v=NIzt_fAXL2w'},
    {n:'Crossover polia baixa', w:8, v:'https://www.youtube.com/watch?v=bIkTWALrmWE'},
    {n:'Crossover polia alta', w:13, v:'https://www.youtube.com/watch?v=LY90W4TS18c'},
    {n:'Voador (fly)', w:61, v:'https://www.youtube.com/watch?v=dQie7FIT7Gw'},
    {n:'Tríceps corda', w:28, v:'https://www.youtube.com/watch?v=jd8nbCtQC7M'},
    {n:'Tríceps pulley', w:28, v:'https://www.youtube.com/watch?v=gpdRO7ixZBo', obs:'Com a barra na polia'},
    {n:'Tríceps francês com halter', w:20, v:'https://www.youtube.com/watch?v=DOW3VpJ0-fI', obs:'Sentando'},
  ]},
  { id:'costas', label:'Costas/Bíceps', color:'--costas', exercises:[
    {n:'Puxada alta', w:68, v:'https://www.youtube.com/watch?v=gUfVYr5AaYE', obs:'Pegada aberta normal'},
    {n:'Remada unilateral', w:40, v:'https://www.youtube.com/watch?v=6fIh5HJ1gDg', obs:'Máquina'},
    {n:'Pull down', w:31, v:'https://www.youtube.com/watch?v=hAMcfubonDc'},
    {n:'Rosca direta com halteres', w:12, v:'https://www.youtube.com/watch?v=6iGybF4shts'},
    {n:'Rosca martelo', w:12, v:'https://www.youtube.com/watch?v=8PN6YfFC6Q4'},
    {n:'Rosca invertida', w:16, v:'https://www.youtube.com/watch?v=i9O7gyLCzhg', obs:'Não pular esse'},
  ]},
  { id:'pernas', label:'Pernas', color:'--pernas', exercises:[
    {n:'Agachamento livre', w:40},
    {n:'Agachamentos', v:'https://br.pinterest.com/pin/994240055255985433/', ref:true},
    {n:'Cadeira extensora', w:75, v:'https://www.youtube.com/watch?v=y7GhuVphn4s'},
    {n:'Abdução dos quadris', w:105},
    {n:'Elevação de panturrilha em pé', w:50},
    {n:'Elevação de panturrilha sentado', w:40, v:'https://www.youtube.com/watch?v=i9O7gyLCzhg', obs:'Não pular esse'},
  ]},
  { id:'ombro', label:'Ombro', color:'--ombro', exercises:[
    {n:'Desenvolvimento com halteres', w:20, v:'https://www.youtube.com/watch?v=zoXE8hI9zoI'},
    {n:'Elevação lateral', w:12, v:'https://www.youtube.com/watch?v=BbqxfNwfU0c'},
    {n:'Elevação frontal', w:10, v:'https://www.youtube.com/watch?v=kC5plIb7wvo'},
    {n:'Elevação lateral na polia', w:8, v:'https://www.youtube.com/watch?v=3vbYw9xklBc'},
    {n:'Remada alta', w:35, v:'https://www.youtube.com/watch?v=pz-b9FNdAFY&t=55'},
  ]},
  { id:'upper', label:'Upper', color:'--upper', exercises:[
    {n:'Supino inclinado com halteres', w:26, v:'https://www.youtube.com/watch?v=Q3pBqViVZw4', obs:'30°'},
    {n:'Voador (fly)', w:68, v:'https://www.youtube.com/watch?v=9BEQWr0u-ac'},
    {n:'Puxada alta com pegada neutra', w:68, v:'https://www.youtube.com/watch?v=4-PsgYmkDsM', obs:'Barra média (neutra ou H)'},
    {n:'Remada unilateral', w:24, v:'https://www.youtube.com/watch?v=Ub8-llUEf6c'},
    {n:'Tríceps corda', w:26, v:'https://www.youtube.com/watch?v=Lv1uMTWQ0Ww'},
    {n:'Rosca direta ou elevação lateral', w:12, v:'https://www.youtube.com/watch?v=AGX6eWXoL9E', obs:'Escolhe um dos dois e varia por semana'},
  ]},
];
DAYS.forEach((d,i)=>{ d.ord = (i+1)+'º'; d.weekday = WEEKDAYS[i] || ''; });

function loadExercises(){
  try{
    const raw = JSON.parse(localStorage.getItem('treino-exercises')||'null');
    if(raw) return raw;
  }catch(e){}
  const obj = {};
  DAYS.forEach(day=>{ obj[day.id] = day.exercises.map((ex,idx)=>({...ex, id: day.id+'-'+idx})); });
  return obj;
}
let exercisesState = loadExercises();
function saveExercises(){ try{ localStorage.setItem('treino-exercises', JSON.stringify(exercisesState)); }catch(e){} }
saveExercises();

function normKey(name){
  return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
document.getElementById('motivation').textContent = MOTIVATION[new Date().getDay()];

let weights = {};
try{ weights = JSON.parse(localStorage.getItem('treino-weights')||'{}'); }catch(e){ weights = {}; }
const exLabels = {};
DAYS.forEach(day=>{ (exercisesState[day.id]||[]).forEach(ex=>{
  const k = normKey(ex.n);
  if(!(k in exLabels)) exLabels[k] = ex.n;
  if(ex.w==null) return;
  if(!(k in weights)) weights[k] = ex.w;
});});
function saveWeights(){ try{ localStorage.setItem('treino-weights', JSON.stringify(weights)); }catch(e){} }
saveWeights();

let setsState = {};
try{
  const raw = JSON.parse(localStorage.getItem('treino-sets')||'{}');
  setsState = raw.date === todayStr() ? raw.data : {};
}catch(e){ setsState = {}; }
function saveSets(){ try{ localStorage.setItem('treino-sets', JSON.stringify({date:todayStr(), data:setsState})); }catch(e){} }

let histDays = {}, histCounts = {}, histWeights = {};
try{ histDays = JSON.parse(localStorage.getItem('treino-hist-days')||'{}'); }catch(e){}
try{ histCounts = JSON.parse(localStorage.getItem('treino-hist-counts')||'{}'); }catch(e){}
try{ histWeights = JSON.parse(localStorage.getItem('treino-hist-weights')||'{}'); }catch(e){}
function saveHist(){
  try{
    localStorage.setItem('treino-hist-days', JSON.stringify(histDays));
    localStorage.setItem('treino-hist-counts', JSON.stringify(histCounts));
    localStorage.setItem('treino-hist-weights', JSON.stringify(histWeights));
  }catch(e){}
}
function logSetDone(dayId, k){
  const t = todayStr();
  if(!histDays[t]) histDays[t] = [];
  if(!histDays[t].includes(dayId)) histDays[t].push(dayId);
  histCounts[k] = (histCounts[k]||0) + 1;
  saveHist();
}
function logWeightChange(k, w){
  if(!histWeights[k]) histWeights[k] = [];
  const last = histWeights[k][histWeights[k].length-1];
  if(!last || last.w !== w){
    histWeights[k].push({date:todayStr(), w});
    saveHist();
  }
}

let restDuration = parseInt(localStorage.getItem('treino-rest')||'60',10);
let timerInterval = null, timerRemaining = 0;

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22,0.44,0.66].forEach((t,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='square'; o.frequency.value = 780 + i*120;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.2);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.22);
    });
  }catch(e){}
}

const ISO_SECONDS = 60;
let iso = {running:false, remaining:ISO_SECONDS, finished:false, endAt:0};
let isoInterval = null;
function isoLevel(){
  if(iso.running && !iso.finished){
    if(iso.remaining <= 8) return 'danger';
    if(iso.remaining <= 15) return 'warn';
  }
  return '';
}
function isoTick(){
  if(!iso.running) return;
  iso.remaining = Math.max(0, Math.ceil((iso.endAt - Date.now())/1000));
  if(iso.remaining <= 0){
    clearInterval(isoInterval); isoInterval = null;
    iso.running = false; iso.finished = true; iso.remaining = 0;
    persistTimers();
    beep();
    if(navigator.vibrate) navigator.vibrate([250,120,250,120,450]);
    render();
    setTimeout(()=>{ iso = {running:false, remaining:ISO_SECONDS, finished:false, endAt:0}; persistTimers(); render(); }, 6000);
  } else {
    const el = document.getElementById('isoNum');
    if(el) el.textContent = iso.remaining;
    const card = document.getElementById('isoCard');
    if(card) card.className = 'iso-card ' + isoLevel();
  }
}
function isoAction(act){
  if(act==='start'){
    if(iso.finished) iso = {running:false, remaining:ISO_SECONDS, finished:false, endAt:0};
    iso.running = true;
    iso.endAt = Date.now() + iso.remaining*1000;
    if(isoInterval) clearInterval(isoInterval);
    isoInterval = setInterval(isoTick, 1000);
  } else if(act==='pause'){
    if(iso.running) iso.remaining = Math.max(1, Math.ceil((iso.endAt - Date.now())/1000));
    if(isoInterval) clearInterval(isoInterval);
    isoInterval = null; iso.running = false;
  } else if(act==='reset'){
    if(isoInterval) clearInterval(isoInterval);
    isoInterval = null;
    iso = {running:false, remaining:ISO_SECONDS, finished:false, endAt:0};
  }
  persistTimers();
  render();
}
function isoCardHTML(){
  if(iso.finished){
    return `<div class="iso-card alert">
      <div class="iso-top"><div><div class="iso-title">Isometria concluída! 💪</div><div class="iso-sub">Boa!</div></div><div class="iso-num">0</div></div>
      <div class="iso-actions"><button class="iso-btn" data-iso="reset">Reiniciar</button></div>
    </div>`;
  }
  const started = iso.remaining < ISO_SECONDS;
  const mainBtn = iso.running
    ? `<button class="iso-btn" data-iso="pause">⏸ Pausar</button>`
    : `<button class="iso-btn" data-iso="start">${started ? '▶ Continuar' : '▶ Iniciar '+ISO_SECONDS+'s'}</button>`;
  const resetBtn = (started || iso.running) ? `<button class="iso-btn ghost" data-iso="reset">↺</button>` : '';
  return `<div class="iso-card ${isoLevel()}" id="isoCard">
    <div class="iso-top"><div><div class="iso-title">⏱ Isometria</div><div class="iso-sub">Opcional • contagem regressiva de ${ISO_SECONDS}s</div></div><div class="iso-num" id="isoNum">${iso.remaining}</div></div>
    <div class="iso-actions">${mainBtn}${resetBtn}</div>
  </div>`;
}

let activeTimer = null; // {cardKey, remaining, alerting, endAt}
function persistTimers(){
  try{
    localStorage.setItem('treino-timers', JSON.stringify({
      rest: (activeTimer && !activeTimer.alerting) ? {cardKey:activeTimer.cardKey, endAt:activeTimer.endAt} : null,
      iso: {running:iso.running, remaining:iso.remaining, endAt:iso.endAt}
    }));
  }catch(e){}
}

function timerTick(){
  if(!activeTimer || activeTimer.alerting) return;
  activeTimer.remaining = Math.max(0, Math.ceil((activeTimer.endAt - Date.now())/1000));
  const box = document.getElementById('cardtimer-'+activeTimer.cardKey);
  if(activeTimer.remaining <= 0){
    clearInterval(timerInterval); timerInterval = null;
    activeTimer.alerting = true;
    persistTimers();
    beep();
    if(navigator.vibrate) navigator.vibrate([250,120,250,120,450]);
    renderCardTimer(activeTimer.cardKey);
    setTimeout(()=>{ activeTimer = null; renderCardTimer(); }, 5000);
  } else if(box) {
    box.querySelector('.timer-big').textContent = activeTimer.remaining;
  }
}
function startTimer(cardKey, sec){
  restDuration = sec;
  localStorage.setItem('treino-rest', sec);
  activeTimer = {cardKey, remaining:sec, alerting:false, endAt:Date.now()+sec*1000};
  persistTimers();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(timerTick, 1000);
  renderCardTimer(cardKey);
}
function cardTimerHTML(cardKey){
  if(!activeTimer || activeTimer.cardKey !== cardKey) return '';
  if(activeTimer.alerting){
    return `<div class="card-timer alert" id="cardtimer-${cardKey}">
      <div class="timer-left"><div class="timer-big">0</div><div class="timer-label">Descanso acabou! 💪</div></div>
    </div>`;
  }
  return `<div class="card-timer" id="cardtimer-${cardKey}">
    <div class="timer-left"><div class="timer-big">${activeTimer.remaining}</div><div class="timer-label">Descansando...</div></div>
    <div class="timer-actions">
      <button class="tbtn" data-tadd="${cardKey}">+15s</button>
      <button class="tbtn" data-tskip="${cardKey}">Pular</button>
    </div>
  </div>`;
}
function renderCardTimer(cardKey){
  // Full re-render keeps card list in sync with timer state (start/stop/alert)
  render();
}
function bindCardTimerEvents(main){
  main.querySelectorAll('[data-tadd]').forEach(b=>{
    b.onclick = ()=>{ if(activeTimer){ activeTimer.endAt += 15000; activeTimer.remaining += 15; persistTimers(); renderCardTimer(activeTimer.cardKey); } };
  });
  main.querySelectorAll('[data-tskip]').forEach(b=>{
    b.onclick = ()=>{ if(timerInterval) clearInterval(timerInterval); activeTimer = null; persistTimers(); render(); };
  });
}

function getWeekRange(d){
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diff);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return [monday.toISOString().slice(0,10), sunday.toISOString().slice(0,10)];
}
function lineChartSVG(entries, uid){
  const w = 300, h = 152, padX = 20, padTop = 26, padBottom = 30;
  const innerW = w - padX*2, innerH = h - padTop - padBottom;
  const gid = 'evoglow-' + uid;
  const vals = entries.map(e=>e.w);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const pts = entries.map((e,i)=>{
    const x = entries.length===1 ? padX+innerW/2 : padX + (i/(entries.length-1))*innerW;
    const y = padTop + innerH - ((e.w-min)/range)*innerH;
    return {x, y, w:e.w, date:e.date};
  });
  const line = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const gridLines = [0,0.5,1].map(f=>{
    const y = (padTop + f*innerH).toFixed(1);
    return `<line x1="${padX}" y1="${y}" x2="${w-padX}" y2="${y}" stroke="#2E2B25" stroke-width="1" stroke-dasharray="3,4"/>`;
  }).join('');
  const glow = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="#F5C518" opacity=".22" filter="url(#${gid})"/>`).join('');
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="#F5C518" stroke="#0D0D0D" stroke-width="1.5"/>`).join('');
  const labels = pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${Math.max(13,p.y-13).toFixed(1)}" font-size="13" fill="#F5C518" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="700">${p.w}</text>`).join('');
  const dates = pts.map((p,i)=>{
    const dateLbl = p.date.slice(8,10)+'/'+p.date.slice(5,7);
    let arrow = '', color = '#948D7E';
    if(i>0){
      if(p.w > pts[i-1].w){ arrow=' ▲'; color='#5FD068'; }
      else if(p.w < pts[i-1].w){ arrow=' ▼'; color='#FF6B5B'; }
      else { arrow=' –'; color='#948D7E'; }
    }
    return `<text x="${p.x.toFixed(1)}" y="${h-8}" font-size="10" text-anchor="middle" font-family="Inter, sans-serif"><tspan fill="#948D7E">${dateLbl}</tspan><tspan fill="${color}" font-weight="700">${arrow}</tspan></text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="evo-linechart" style="width:100%; height:${h}px; display:block;">
    <defs><filter id="${gid}" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
    ${gridLines}
    <polyline points="${line}" fill="none" stroke="#F5C518" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${glow}${dots}${labels}${dates}
  </svg>`;
}
function renderEvo(){
  const [mon, sun] = getWeekRange(new Date());
  const monthPrefix = todayStr().slice(0,7);
  let weekCount = 0, monthCount = 0;
  Object.keys(histDays).forEach(d=>{
    if(!histDays[d] || !histDays[d].length) return;
    if(d >= mon && d <= sun) weekCount++;
    if(d.startsWith(monthPrefix)) monthCount++;
  });
  document.getElementById('evoWeek').textContent = weekCount;
  document.getElementById('evoMonth').textContent = monthCount;

  const entries = Object.entries(histCounts).sort((a,b)=>b[1]-a[1]);
  const evoTop = document.getElementById('evoTop');
  if(!entries.length){
    evoTop.innerHTML = '<div class="evo-empty">Marca suas séries pra começar a ver os dados aqui.</div>';
  } else {
    evoTop.innerHTML = entries.slice(0,3).map(([k,c])=>`
      <div class="evo-top"><div class="name">${exLabels[k]||k}</div><div class="cnt">${c}x marcado</div></div>
    `).join('');
  }

  const evoHist = document.getElementById('evoHist');
  const histKeys = Object.keys(histWeights).filter(k=>histWeights[k] && histWeights[k].length);
  if(!histKeys.length){
    evoHist.innerHTML = '<div class="evo-empty">Assim que você mudar uma carga, o histórico aparece aqui.</div>';
  } else {
    evoHist.innerHTML = histKeys.map(k=>{
      const entries = histWeights[k].slice(-8); // cronológico, mais antigo à esquerda
      return `<div class="evo-hist"><div class="name">${exLabels[k]||k}</div>${lineChartSVG(entries, k)}</div>`;
    }).join('');
  }
}
document.getElementById('openEvo').onclick = ()=>{ renderEvo(); document.getElementById('evoPanel').classList.add('show'); };
document.getElementById('closeEvo').onclick = ()=>{ document.getElementById('evoPanel').classList.remove('show'); };

// Retoma cronômetros se a página foi recarregada no meio do descanso
try{
  const t = JSON.parse(localStorage.getItem('treino-timers')||'{}');
  if(t.rest && t.rest.endAt > Date.now()){
    activeTimer = {cardKey:t.rest.cardKey, remaining:Math.ceil((t.rest.endAt-Date.now())/1000), alerting:false, endAt:t.rest.endAt};
    timerInterval = setInterval(timerTick, 1000);
  }
  if(t.iso){
    if(t.iso.running && t.iso.endAt > Date.now()){
      iso = {running:true, remaining:Math.ceil((t.iso.endAt-Date.now())/1000), finished:false, endAt:t.iso.endAt};
      isoInterval = setInterval(isoTick, 1000);
    } else if(!t.iso.running && t.iso.remaining > 0 && t.iso.remaining < ISO_SECONDS){
      iso = {running:false, remaining:t.iso.remaining, finished:false, endAt:0};
    }
  }
}catch(e){}

// Manter a tela ligada enquanto o app estiver aberto
let wakeLock = null;
function updateWakeStatus(){
  const el = document.getElementById('wakeStatus');
  if(!el) return;
  if(wakeLock) el.textContent = '🔆 Tela sempre ligada enquanto o app estiver aberto';
  else if('wakeLock' in navigator) el.textContent = '🌙 Tela pode apagar — toque aqui pra manter ligada';
  else el.textContent = 'Este navegador não permite manter a tela ligada';
}
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; updateWakeStatus(); });
    }
  }catch(e){ wakeLock = null; }
  updateWakeStatus();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    requestWakeLock();
    if(activeTimer && !activeTimer.alerting) timerTick();
    if(iso.running) isoTick();
  }
});
document.addEventListener('pointerdown', ()=>{ if(!wakeLock) requestWakeLock(); }, {once:false});
document.getElementById('wakeStatus').onclick = requestWakeLock;
requestWakeLock();

let editMode = false, editingId = null, sortableInst = null;
function toggleEditMode(){ editMode = !editMode; editingId = null; render(); }
function addExercise(dayId){
  const id = dayId + '-new-' + Date.now();
  exercisesState[dayId].push({id, n:'Novo exercício', w:null, v:'', obs:''});
  saveExercises();
  editingId = id;
  render();
}
function deleteExercise(dayId, id){
  if(!confirm('Excluir esse exercício? Essa ação não pode ser desfeita.')) return;
  exercisesState[dayId] = exercisesState[dayId].filter(e=>e.id!==id);
  delete setsState[id];
  saveExercises(); saveSets();
  render();
}
function saveExerciseEdit(dayId, id, data){
  const ex = (exercisesState[dayId]||[]).find(e=>e.id===id);
  if(!ex) return;
  ex.n = data.n.trim() || ex.n;
  ex.w = data.w === '' ? null : Math.max(0, parseFloat(data.w)||0);
  ex.v = data.v.trim() || undefined;
  ex.obs = data.obs.trim() || undefined;
  const k = normKey(ex.n);
  if(!(k in exLabels)) exLabels[k] = ex.n;
  if(ex.w!=null && !(k in weights)) weights[k] = ex.w;
  saveExercises(); saveWeights();
  editingId = null;
  render();
}
function initSortable(dayId){
  const list = document.getElementById('cardsList');
  if(!list || typeof Sortable === 'undefined') return;
  if(sortableInst) sortableInst.destroy();
  sortableInst = new Sortable(list, {
    handle: '.drag-handle', animation:150,
    onEnd: function(){
      const ids = Array.from(list.children).map(el=>el.dataset.id);
      exercisesState[dayId] = ids.map(id=> exercisesState[dayId].find(e=>e.id===id));
      saveExercises();
    }
  });
}

let active = localStorage.getItem('treino-active-day') || DAYS[0].id;
if(!DAYS.find(d=>d.id===active)) active = DAYS[0].id;

function cardDone(ex){
  const arr = setsState[ex.id] || [false,false,false];
  return arr[0] && arr[1] && arr[2];
}
function dayComplete(day){
  const exs = exercisesState[day.id]||[];
  return exs.length>0 && exs.every(ex=> cardDone(ex));
}

function render(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = DAYS.map(d=>`<button class="tab${d.id===active?' active':''}" data-day="${d.id}">${d.label}</button>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick = ()=>{ active = btn.dataset.day; editingId = null; localStorage.setItem('treino-active-day', active); render(); };
  });

  const day = DAYS.find(d=>d.id===active);
  const exs = exercisesState[day.id] || [];
  document.getElementById('daycaption').innerHTML = `<span class="ord">${day.ord}</span><span>treino • ${day.weekday}</span><button class="edit-toggle${editMode?' active':''}" id="editToggle">${editMode?'✓ Concluir edição':'✏️ Editar'}</button>`;
  document.getElementById('editToggle').onclick = toggleEditMode;

  const main = document.getElementById('main');
  const banner = (!editMode && dayComplete(day)) ? `
    <div class="day-complete">
      <span class="fire">🔥🔥🔥</span>
      <div class="msg">Treino de ${day.label} 🔥 concluído!</div>
      <button id="restartDay">Iniciar novo treino</button>
    </div>` : '';

  const cardsHTML = exs.map(ex=>{
    if(editMode){
      if(editingId === ex.id){
        return `<div class="card" data-id="${ex.id}">
          <div class="edit-form">
            <label>Nome</label><input type="text" id="ef-n-${ex.id}" value="${(ex.n||'').replace(/"/g,'&quot;')}">
            <label>Peso inicial (kg, opcional)</label><input type="number" id="ef-w-${ex.id}" value="${ex.w??''}">
            <label>Link do vídeo (opcional)</label><input type="text" id="ef-v-${ex.id}" value="${(ex.v||'').replace(/"/g,'&quot;')}">
            <label>Observação (opcional)</label><input type="text" id="ef-o-${ex.id}" value="${(ex.obs||'').replace(/"/g,'&quot;')}">
            <div class="edit-form-actions">
              <button class="edit-save" data-save="${ex.id}">Salvar</button>
              <button class="edit-cancel" data-cancel="1">Cancelar</button>
            </div>
          </div>
        </div>`;
      }
      return `<div class="card editing-row" data-id="${ex.id}">
        <span class="drag-handle">⠿</span>
        <div class="ex-name-wrap"><div class="ex-name">${ex.n}</div></div>
        <button class="icon-btn" data-edit="${ex.id}">✎</button>
        <button class="icon-btn danger" data-del="${ex.id}">🗑</button>
      </div>`;
    }
    const k = normKey(ex.n);
    const hasWeight = ex.w!=null;
    const wVal = hasWeight ? weights[k] : null;
    const weightHTML = hasWeight ? `
      <div class="weight-box">
        <button class="stepper" data-act="minus" data-key="${k}">−</button>
        <input class="weight-val" data-key="${k}" type="number" step="1" value="${wVal}">
        <span class="unit">kg</span>
        <button class="stepper" data-act="plus" data-key="${k}">+</button>
      </div>` : `<span class="no-weight">3 séries</span>`;
    const isRef = ex.v && ex.v.indexOf('pinterest') !== -1;
    const videoHTML = ex.v ? `<a class="video-btn" href="${ex.v}" target="_blank" rel="noopener noreferrer">${isRef?'🔗 Ver ref.':'▶ Vídeo'}</a>` : '';
    const obsHTML = ex.obs ? `<span class="obs">${ex.obs}</span>` : `<span class="obs empty-obs">-</span>`;
    const done = setsState[ex.id] || [false,false,false];
    const allDone = done[0] && done[1] && done[2];
    const setsHTML = [0,1,2].map(i=>`<button class="setdot${done[i]?' done':''}" data-card="${ex.id}" data-set="${i}" data-key="${k}" data-day="${day.id}">${i+1}</button>`).join('');
    const metaHTML = allDone ? `<span class="check-badge">✓ Concluído</span>` : `3 séries`;
    return `<div class="card" data-id="${ex.id}" style="--dcolor:var(${day.color})">
      <div class="card-top">
        <span class="drag-handle">⠿</span>
        <div class="ex-name-wrap"><div class="ex-name">${allDone ? '🔥 ' : ''}${ex.n}</div><div class="ex-meta">${metaHTML}</div></div>
        ${weightHTML}
      </div>
      <div class="card-mid"><div class="sets">${setsHTML}</div></div>
      <div class="card-bottom">${obsHTML}${videoHTML}</div>
      ${cardTimerHTML(ex.id)}
    </div>`;
  }).join('');

  const addBtn = editMode ? `<button class="add-ex-btn" id="addExBtn">+ Adicionar exercício</button>` : '';
  main.innerHTML = banner + `<div id="cardsList">${cardsHTML}</div>` + addBtn + (editMode ? '' : isoCardHTML());

  const restartBtn = document.getElementById('restartDay');
  if(restartBtn) restartBtn.onclick = ()=>{
    exs.forEach(ex=>{ delete setsState[ex.id]; });
    saveSets(); render();
  };

  const addExBtn = document.getElementById('addExBtn');
  if(addExBtn) addExBtn.onclick = ()=> addExercise(day.id);

  main.querySelectorAll('[data-edit]').forEach(b=>{ b.onclick = ()=>{ editingId = b.dataset.edit; render(); }; });
  main.querySelectorAll('[data-del]').forEach(b=>{ b.onclick = ()=> deleteExercise(day.id, b.dataset.del); });
  main.querySelectorAll('[data-cancel]').forEach(b=>{ b.onclick = ()=>{ editingId = null; render(); }; });
  main.querySelectorAll('[data-save]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.save;
      saveExerciseEdit(day.id, id, {
        n: document.getElementById('ef-n-'+id).value,
        w: document.getElementById('ef-w-'+id).value,
        v: document.getElementById('ef-v-'+id).value,
        obs: document.getElementById('ef-o-'+id).value
      });
    };
  });

  main.querySelectorAll('.stepper').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.key;
      const delta = b.dataset.act==='plus' ? 1 : -1;
      weights[k] = Math.max(0, (parseFloat(weights[k])||0) + delta);
      saveWeights(); logWeightChange(k, weights[k]); render();
    };
  });
  main.querySelectorAll('.weight-val').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const k = inp.dataset.key;
      weights[k] = Math.max(0, parseFloat(inp.value)||0);
      saveWeights(); logWeightChange(k, weights[k]); render();
    });
  });
  main.querySelectorAll('.setdot').forEach(b=>{
    b.onclick = ()=>{
      const ck = b.dataset.card, si = parseInt(b.dataset.set,10), k = b.dataset.key, dId = b.dataset.day;
      if(!setsState[ck]) setsState[ck] = [false,false,false];
      const wasDone = setsState[ck][si];
      setsState[ck][si] = !wasDone;
      saveSets();
      if(!wasDone){ logSetDone(dId, k); startTimer(ck, restDuration); }
      else {
        if(timerInterval) clearInterval(timerInterval);
        activeTimer = null;
        persistTimers();
        render();
      }
    };
  });
  main.querySelectorAll('[data-iso]').forEach(b=>{ b.onclick = ()=> isoAction(b.dataset.iso); });
  bindCardTimerEvents(main);

  initSortable(day.id);
}
render();
</script>
</body>
</html>
